name: Recognition Suggestion
description: Suggest a person, project, or tool to feature on the Bamwerks Recognition page
title: "[Recognition] "
labels: ["recognition"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of recognition are you suggesting?
      options:
        - Person / Influence
        - Diamond Tier Provider
        - Gold Tier Provider
        - Open Source Project
        - Other
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: Name of the person, project, or organization
      placeholder: e.g., "Jane Smith" or "Tailwind CSS"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why should they be recognized?
      description: Brief explanation of their contribution or impact
      placeholder: Describe how they've contributed to Bamwerks or the broader community
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      description: Website, GitHub, or profile URL (optional)
      placeholder: https://
    validations:
      required: false
