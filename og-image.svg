<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Accent glow effect -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0" />
    </radialGradient>
  </defs>
  <ellipse cx="600" cy="250" rx="400" ry="300" fill="url(#glow)"/>
  
  <!-- Main title: Bamwerks -->
  <text x="600" y="280" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="96" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle">Bamwerks</text>
  
  <!-- Accent underline -->
  <rect x="400" y="300" width="400" height="4" fill="#3b82f6" opacity="0.8"/>
  
  <!-- Subtitle -->
  <text x="600" y="360" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="32" 
        font-weight="400" 
        fill="#9ca3af" 
        text-anchor="middle">Governance-First AI Agent Operations</text>
  
  <!-- Stats line -->
  <text x="600" y="480" 
        font-family="system-ui, -apple-system, monospace" 
        font-size="20" 
        font-weight="500" 
        fill="#3b82f6" 
        text-anchor="middle" 
        letter-spacing="2">33 AGENTS · 8 SWARMS · FORGE FRAMEWORK</text>
</svg>
